<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Ben 10 Multiverso Mobile</title><style>
*{box-sizing:border-box}body{margin:0;background:#091923;color:white;font-family:Arial;touch-action:manipulation}header{height:12vh;display:flex;align-items:center;justify-content:space-around;background:#102a22;border-bottom:3px solid #39e66b}h1{font-size:clamp(15px,3vw,24px);color:#7cff9c}button{border:0;border-radius:12px;padding:12px;background:#37dc68;color:#092010;font-weight:bold;font-size:15px}#world{height:57vh;position:relative;overflow:hidden;background:linear-gradient(#77c8e8 0 55%,#394c43 55%)}.tower{position:absolute;bottom:0;width:18%;background:#344b5c;border:3px solid #20313c}.tower:after{content:"";display:block;height:100%;background:repeating-linear-gradient(90deg,#9ee9db 0 8px,transparent 8px 23px),repeating-linear-gradient(#9ee9db 0 7px,transparent 7px 25px);opacity:.6}#hero{position:absolute;left:45%;bottom:12%;width:45px;height:78px;border-radius:15px;background:#19a34a;border:4px solid #143322}#hero:before{content:"";position:absolute;top:-27px;left:4px;width:30px;height:27px;border-radius:50%;background:#efc39f;border:2px solid #222}#street{position:absolute;bottom:0;height:13%;width:100%;background:#27343b}#controls{height:31vh;display:flex;justify-content:space-around;align-items:center;gap:5px;padding:6px}.pad,.actions{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:38%}.pad button,.actions button{min-width:44px;min-height:43px;background:#254354;color:white}.watch{border-radius:50%;width:78px;height:78px;background:#123b25;border:4px solid #48f77b;color:#baffc9}#status{text-align:center;font-size:12px;color:#b9f4c8}#dialog{display:none;position:absolute;inset:14vh 5vw 32vh;background:#102b37;border:2px solid #5cff85;border-radius:16px;padding:14px;text-align:center;z-index:3}#choices{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:15px}</style></head><body>
<header><h1>BEN 10: MULTIVERSO MOBILE</h1><button onclick="heroes()">HERÓIS</button></header>
<div id="world"><div class="tower" style="left:4%;height:60%"></div><div class="tower" style="left:27%;height:78%"></div><div class="tower" style="right:5%;height:66%"></div><div class="tower" style="right:29%;height:48%"></div><div id="hero"></div><div id="street"></div></div>
<div id="controls"><div class="pad"><button onclick="move(-1)">◀</button><button onclick="move(1)">▶</button><button onclick="jump()">PULAR</button></div><div><button class="watch" onclick="aliens()">OMNITRIX</button><div id="status">Ben Clássico • Humano</div></div><div class="actions"><button onclick="say('Correndo!')">CORRER</button><button onclick="say('Ataque!')">ATACAR</button><button onclick="say('Missões em breve!')">MISSÕES</button></div></div>
<div id="dialog"><h2 id="heading"></h2><div id="choices"></div><button onclick="closeDialog()">VOLTAR</button></div>
<script>
let pos=45,who='Ben Clássico',form='Humano';const hero=document.getElementById('hero'),status=document.getElementById('status');
function move(d){pos=Math.max(2,Math.min(92,pos+d*4));hero.style.left=pos+'%'}function jump(){hero.animate([{transform:'translateY(0)'},{transform:'translateY(-65px)'},{transform:'translateY(0)'}],{duration:420})}
function say(t){status.textContent=t}function dialog(t,opts,fn){heading.textContent=t;choices.innerHTML='';opts.forEach(v=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>{fn(v);closeDialog()};choices.appendChild(b)});document.getElementById('dialog').style.display='block'}
function closeDialog(){document.getElementById('dialog').style.display='none'}function heroes(){dialog('Escolha seu herói',['Ben Clássico','Ben Omniverse','Ben Moderno'],v=>{who=v;form='Humano';status.textContent=who+' • '+form})}
function aliens(){dialog('Escolha uma transformação',['Chama','Quatro Braços','XLR8','Diamante','Besta','Eco Eco'],v=>{form=v;hero.style.background=v==='Chama'?'#f97316':v==='Diamante'?'#67e8f9':'#16a34a';status.textContent=who+' • '+form})}heroes();
</script></body></html>
